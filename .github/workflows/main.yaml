---
name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup CI
        id: setup-ci
        uses: ./.github/actions/setup-ci
        with:
          install-zig: 'true'

  check:
    name: Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup CI
        uses: ./.github/actions/setup-ci
      - name: Run checks
        run: pnpm check

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          install-zig: 'true'
      - name: DIAGNOSTIC typedoc resolution
        continue-on-error: true
        run: |
          set +e
          echo "node: $(node --version)  pnpm: $(pnpm --version)"
          echo "--- full contents of root node_modules/typedoc ---"
          find node_modules/typedoc -maxdepth 2 2>&1 | head -20
          echo "--- is it a symlink? ---"
          readlink node_modules/typedoc || echo "NOT a symlink"
          echo "--- typedoc dirs in .pnpm ---"
          ls -d node_modules/.pnpm/typedoc@* 2>&1 | head -5
          echo "--- .pnpm/node_modules/typedoc ---"
          readlink node_modules/.pnpm/node_modules/typedoc || ls -la node_modules/.pnpm/node_modules/typedoc 2>&1 | head -3
          echo "--- resolve from plugin dir ---"
          PLUGIN=$(find node_modules/.pnpm -maxdepth 4 -type d -name typedoc-plugin-frontmatter | head -1)
          echo "plugin at: $PLUGIN"
          ls -la "$PLUGIN/.." 2>&1 | head -8
          (cd "$PLUGIN" && node --input-type=module -e "import('typedoc').then(m=>console.log('IMPORT OK',typeof m.ReflectionKind)).catch(e=>console.log('IMPORT FAIL',e.code,e.message))") 2>&1 | head -4
        shell: bash -euo pipefail {0}
      - name: Build project
        run: pnpm build
